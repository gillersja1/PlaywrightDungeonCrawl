# Render Blueprint: deploys the dungeon from the Dockerfile on Render's free plan.
# Render sets PORT, which Program.cs listens on.
services:
  - type: web
    name: playwright-dungeon-crawl
    runtime: docker
    plan: free
    branch: main
    # Deploy each push to main, but only once CI has passed.
    autoDeployTrigger: checksPass
    healthCheckPath: /health
    envVars:
      # Signs the treasure flags. Render generates a random value once and keeps it.
      - key: Dungeon__FlagSecret
        generateValue: true
      # GitHub sign-in and saved progress. sync: false means Render asks for
      # the values when the Blueprint syncs; they never live in this repo.
      - key: GitHub__ClientId
        sync: false
      - key: GitHub__ClientSecret
        sync: false
      # Neon's connection string (the postgresql://... URL is fine).
      - key: ConnectionStrings__Dungeon
        sync: false
      # Traces, metrics and logs to Grafana Cloud. Leave both unset to turn
      # telemetry off; the values come from Grafana's OpenTelemetry (OTLP) page.
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        sync: false
      - key: OTEL_EXPORTER_OTLP_HEADERS
        sync: false
