name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-crawl:
    runs-on: ubuntu-latest
    # For the Postgres tests: saved progress and the sign-in cookie keys.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build PlaywrightDungeonCrawl.slnx -c Release

      - name: Run tests
        env:
          DUNGEON_TEST_POSTGRES: Host=localhost;Database=postgres;Username=postgres;Password=postgres
        run: dotnet test tests/PlaywrightDungeonCrawl.Tests -c Release --no-build --logger "trx;LogFileName=unit.trx" --results-directory TestResults

      # The reference solutions crawl the Docker image, so one run checks the
      # image starts, serves the site, and every room can still be cleared.
      - name: Send test results to Grafana
        if: always()
        uses: gillersja1/test-results-otel@v1
        with:
          results: TestResults/unit.trx
          suite: unit
          otlp-endpoint: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          otlp-headers: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}

      - name: Build Docker image
        run: docker build -t playwright-dungeon-crawl .

      - name: Start the dungeon
        run: |
          docker run -d --name dungeon -p 8080:8080 -e Dungeon__FlagSecret=ci-secret playwright-dungeon-crawl
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/health && exit 0
            sleep 1
          done
          docker logs dungeon
          exit 1

      - name: Install Playwright browsers
        run: pwsh tests/PlaywrightDungeonCrawl.Solutions/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Run reference solutions
        env:
          DUNGEON_URL: http://localhost:8080
        run: dotnet test tests/PlaywrightDungeonCrawl.Solutions -c Release --no-build --logger "trx;LogFileName=solutions.trx" --results-directory TestResults

      - name: Send test results to Grafana
        if: always()
        uses: gillersja1/test-results-otel@v1
        with:
          results: TestResults/solutions.trx
          suite: reference-solutions
          otlp-endpoint: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          otlp-headers: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}

      # The same rooms, cleared in TypeScript from a fresh copy of the TypeScript
      # starter kit, so the kit, the TypeScript hints and the rooms stay in step.
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*

      - name: Run TypeScript reference solutions
        env:
          DUNGEON_URL: http://localhost:8080
          CI: true
        run: |
          git clone --depth 1 https://github.com/gillersja1/PlaywrightDungeonCrawl-Starter-TS ts-kit
          cp tests/ts-solutions/*.spec.ts ts-kit/tests/
          cd ts-kit
          npm ci
          npx playwright install --with-deps chromium
          npx tsc -p .
          npx playwright test --reporter=list

      - name: Dungeon logs
        if: failure()
        run: docker logs dungeon
