name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-crawl:
    runs-on: ubuntu-latest
    # The reference solutions are spoilers, so they live in a private repo. Pull requests from forks
    # can't read it (no secrets), so they skip the crawl; everything else still runs.
    env:
      HAS_SOLUTIONS: ${{ secrets.SOLUTIONS_TOKEN != '' }}
    # For the Postgres tests: saved progress and the sign-in cookie keys.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build PlaywrightDungeonCrawl.slnx -c Release

      - name: Run tests
        env:
          DUNGEON_TEST_POSTGRES: Host=localhost;Database=postgres;Username=postgres;Password=postgres
        run: dotnet test tests/PlaywrightDungeonCrawl.Tests -c Release --no-build --logger "trx;LogFileName=unit.trx" --results-directory TestResults

      # The reference solutions crawl the Docker image, so one run checks the
      # image starts, serves the site, and every room can still be cleared.
      - name: Send test results to Grafana
        if: always()
        uses: gillersja1/test-results-otel@v1
        with:
          results: TestResults/unit.trx
          suite: unit
          otlp-endpoint: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          otlp-headers: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}

      - name: Build Docker image
        run: docker build -t playwright-dungeon-crawl .

      - name: Start the dungeon
        run: |
          docker run -d --name dungeon -p 8080:8080 -e Dungeon__FlagSecret=ci-secret playwright-dungeon-crawl
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/health && exit 0
            sleep 1
          done
          docker logs dungeon
          exit 1

      - name: Check out the reference solutions (private)
        if: env.HAS_SOLUTIONS == 'true'
        uses: actions/checkout@v7
        with:
          repository: gillersja1/PlaywrightDungeonCrawl-Solutions
          token: ${{ secrets.SOLUTIONS_TOKEN }}
          path: solutions

      - name: Build the reference solutions
        if: env.HAS_SOLUTIONS == 'true'
        run: dotnet build solutions/PlaywrightDungeonCrawl.Solutions -c Release

      - name: Install Playwright browsers
        if: env.HAS_SOLUTIONS == 'true'
        run: pwsh solutions/PlaywrightDungeonCrawl.Solutions/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Run reference solutions
        if: env.HAS_SOLUTIONS == 'true'
        env:
          DUNGEON_URL: http://localhost:8080
        run: dotnet test solutions/PlaywrightDungeonCrawl.Solutions -c Release --no-build --logger "trx;LogFileName=solutions.trx" --results-directory TestResults

      - name: Send test results to Grafana
        if: always() && env.HAS_SOLUTIONS == 'true'
        uses: gillersja1/test-results-otel@v1
        with:
          results: TestResults/solutions.trx
          suite: reference-solutions
          otlp-endpoint: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          otlp-headers: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}

      # The same rooms, cleared in TypeScript from a fresh copy of the TypeScript
      # starter kit, so the kit, the TypeScript hints and the rooms stay in step.
      - uses: actions/setup-node@v5
        if: env.HAS_SOLUTIONS == 'true'
        with:
          node-version: lts/*

      - name: Run TypeScript reference solutions
        if: env.HAS_SOLUTIONS == 'true'
        env:
          DUNGEON_URL: http://localhost:8080
          CI: true
          # Adds a worker timeline to this run's summary page.
          PLAYWRIGHT_TIMELINE_MARKDOWN_CI: true
        run: |
          git clone --depth 1 https://github.com/gillersja1/PlaywrightDungeonCrawl-Starter-TS ts-kit
          cp solutions/ts-solutions/*.spec.ts ts-kit/tests/
          cd ts-kit
          npm ci
          npm install --no-save playwright-timeline-reporter@1.3.0
          npx playwright install --with-deps chromium
          npx --yes -p typescript tsc -p .
          npx playwright test --reporter=list,playwright-timeline-reporter

      # Interactive timeline of the TypeScript run (download, open index.html).
      - name: Upload timeline report
        if: always() && env.HAS_SOLUTIONS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: timeline-report
          path: ts-kit/timeline-report/
          if-no-files-found: ignore

      - name: Dungeon logs
        if: failure()
        run: docker logs dungeon
