name: Dial experiment (temporary)
on: pull_request
jobs:
  dial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: docker build -t dungeon .
      - run: |
          docker run -d -p 8080:8080 -e Dungeon__FlagSecret=ci-secret dungeon
          for i in $(seq 1 30); do curl -sf http://localhost:8080/health && exit 0; sleep 1; done; exit 1
      - uses: actions/checkout@v7
        with:
          repository: gillersja1/PlaywrightDungeonCrawl-Solutions
          ref: dial-experiment
          token: ${{ secrets.SOLUTIONS_TOKEN }}
          path: solutions
      - run: dotnet build solutions/PlaywrightDungeonCrawl.Solutions -c Release
      - run: pwsh solutions/PlaywrightDungeonCrawl.Solutions/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
      - env:
          DUNGEON_URL: http://localhost:8080
        run: dotnet test solutions/PlaywrightDungeonCrawl.Solutions -c Release --no-build --filter "FullyQualifiedName~DialExperiment" --logger "console;verbosity=detailed" | grep -E "MISS|RESULT|Passed|Failed"
