name: Security scan (OWASP ZAP)

# A passive ZAP baseline scan of the Docker image: it spiders the site and reports missing security headers,
# cookie flags, information leaks and the like. Warnings are reported, not blocking (-I); the HTML report is
# attached to every run.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # Mondays, to catch rules ZAP adds over time
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and start the dungeon
        run: |
          docker build -t playwright-dungeon-crawl .
          docker run -d --name dungeon -p 8080:8080 -e Dungeon__FlagSecret=ci-secret playwright-dungeon-crawl
          for i in $(seq 1 30); do curl -sf http://localhost:8080/health && exit 0; sleep 2; done
          docker logs dungeon; exit 1

      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: http://localhost:8080
          cmd_options: "-I"
          allow_issue_writing: false
          artifact_name: zap-report
