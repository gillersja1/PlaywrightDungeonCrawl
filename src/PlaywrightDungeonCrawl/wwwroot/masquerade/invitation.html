<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>An invitation to the Masked Ball</title>
    <style>
        body { margin: 0; padding: 24px; background: #1a1220; color: #ece4d4; font-family: system-ui, "Segoe UI", sans-serif; }
        form { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; margin: 12px 0; }
        [hidden] { display: none !important; }
    </style>
</head>
<body>
    <!-- Floor 11: Owl's side of the ball. Owl's mask is a cookie with the same name as Fox's. -->
    <h1>The Masked Ball</h1>
    <p class="status" role="status">An invitation for Owl. The doorman squints at you.</p>
    <form class="owl-login">
        <label>Owl's password <input name="password" autocomplete="off"></label>
        <button type="submit">Enter as Owl</button>
    </form>
    <button type="button" class="curtsy" hidden>Return the bow</button>
    <p class="whisper" hidden>Owl whispers: <strong class="word"></strong></p>
    <script src="invitation.js"></script>
</body>
</html>
